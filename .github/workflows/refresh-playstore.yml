name: Refresh Play Store evidence

on:
  schedule:
    # GitHub Actions uses UTC. 02:17 UTC is 07:47 IST every Monday.
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playstore-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch, analyse, validate and rebuild
        id: refresh
        run: npm run refresh:data

      # Predictions are review artifacts, never automatically promoted to human evidence.
      - name: Set up Python for optional semantic classification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect classifier credentials
        id: classifier
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Groq classification skipped: add the GROQ_API_KEY repository secret to enable it."
          fi

      - name: Restore classification checkpoint
        if: steps.classifier.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: analysis/llm/live
          key: groq-reviews-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: groq-reviews-v1-

      - name: Classify up to 100 new or edited reviews
        if: steps.classifier.outputs.enabled == 'true'
        id: classify
        continue-on-error: true
        timeout-minutes: 7
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/classify_reviews_llm.py --limit 100

      - name: Save classification checkpoint
        if: always() && steps.classifier.outputs.enabled == 'true' && steps.classify.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: analysis/llm/live
          key: groq-reviews-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload model suggestions for review
        if: always() && steps.classifier.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-classification-${{ github.run_id }}
          path: analysis/llm/live/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed evidence
        run: |
          npm run build:dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/playstore_metadata.json \
            data/rating_snapshots.csv \
            data/playstore_reviews.csv \
            data/playstore_reviews.json \
            analysis/quantitative_summary.json \
            analysis/recent_rating_by_version.csv \
            analysis/recent_rating_by_week.csv \
            analysis/automation_snapshot.json \
            submission/final/MoveInSync_FDE_Interactive_Dashboard.html
          if git diff --cached --quiet; then
            echo "No public evidence changed."
          else
            git commit -m "data: refresh Play Store evidence"
            git push
          fi
